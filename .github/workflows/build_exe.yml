name: Build and Release .exe

# Triggers on version tags like v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Check out source ───────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies + PyInstaller ─────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      # ── 4. Patch version.txt with tag version ─────────────────────────────
      - name: Patch version.txt
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $parts = $tag.Split(".")
          $v = "$($parts[0]), $($parts[1]), $($parts[2]), 0"
          (Get-Content version.txt) -replace "\(\d+, \d+, \d+, \d+\)", "($v)" | Set-Content version.txt

      # ── 5. Build the executable ───────────────────────────────────────────
      # --onefile        : single self-contained .exe
      # --console        : keep the console window (CLI tool)
      # --name           : output filename
      # --hidden-import  : openpyxl sub-modules that static analysis may miss
      - name: Build .exe with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name qimpexp `
            --hidden-import openpyxl `
            --hidden-import openpyxl.styles `
            --hidden-import openpyxl.utils `
            --hidden-import openpyxl.workbook `
            --version-file version.txt `
            qimpexp.py

      # ── 6. Bundle exe + templates + quick start into a ZIP ───────────────
      - name: Create release ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "qimpexp_${version}.zip"

          New-Item -ItemType Directory -Path release_staging

          Copy-Item dist\qimpexp.exe                release_staging\
          Copy-Item README.FIRST.txt                release_staging\
          Copy-Item acb_worksheet_template.xlsx      release_staging\
          Copy-Item account_periods_template.json    release_staging\
          Copy-Item security_map_template.json       release_staging\

          Compress-Archive -Path release_staging\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ── 7. Compute SHA-256 of the exe ─────────────────────────────────────
      - name: Compute SHA-256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\qimpexp.exe -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA-256: $hash"

      # ── 8. Create GitHub Release and upload artifacts ─────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## QImpExp ${{ github.ref_name }}

            ACB Excel workbook ↔ Quicken QIF converter for Canadian investment accounts.

            ### Download
            - **[qimpexp_${{ github.ref_name }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/qimpexp_${{ github.ref_name }}.zip)** — Windows standalone bundle (no Python required)
            - **[setup.bat](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/setup.bat)** — Python users: download this + the source ZIP below, run `setup.bat` to install dependencies

            **What's in the ZIP:**
            `qimpexp.exe`, `README.FIRST.txt`, `acb_worksheet_template.xlsx`, config templates

            **Getting started (no Python):** unzip anywhere, read README.FIRST.txt, run qimpexp.exe.

            **Getting started (Python):** download source ZIP + setup.bat, extract, double-click `setup.bat`.

            ### SmartScreen warning
            Windows may show "Windows protected your PC" when you run this file.
            Click **More info → Run anyway**. This warning appears because the
            executable is not signed with a paid EV code signing certificate.
            See [BUILD_EXE.md](https://github.com/${{ github.repository }}/blob/main/BUILD_EXE.md)
            for details, or build the .exe yourself from source.

            ### Verify exe integrity (optional)
            ```
            certutil -hashfile qimpexp.exe SHA256
            ```
            Expected: `${{ steps.hash.outputs.sha256 }}`

            ### What's new
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### Python source
            Download the source ZIP below and run `setup.bat` or `python qimpexp.py` directly.
          files: |
            ${{ env.ZIP_NAME }}
            setup.bat
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
