workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - build
  - release

build-exe:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - python --version
    - python -m venv build_env
    - 'build_env\Scripts\activate'
    - pip install openpyxl pyinstaller
    # Patch version.txt with the tag version
    - '$tag = $env:CI_COMMIT_TAG -replace "^v",""'
    - '$parts = $tag.Split(".")'
    - '$v = "$($parts[0]), $($parts[1]), $($parts[2]), 0"'
    - '(Get-Content version.txt) -replace "\(\d+, \d+, \d+, \d+\)", "($v)" | Set-Content version.txt'
    # Build the executable
    - >
      pyinstaller
      --onefile
      --console
      --name qimpexp
      --hidden-import openpyxl
      --hidden-import openpyxl.styles
      --hidden-import openpyxl.utils
      --hidden-import openpyxl.workbook
      --version-file version.txt
      qimpexp.py
    # Compute SHA-256 and store in build.env
    - '$hash = (Get-FileHash dist\qimpexp.exe -Algorithm SHA256).Hash.ToLower()'
    - 'echo "SHA256=$hash" | Out-File -FilePath build.env -Encoding utf8 -Append'
    # Create release ZIP
    - '$version = $env:CI_COMMIT_TAG'
    - '$zipName = "qimpexp_${version}.zip"'
    - 'echo "ZIP_NAME=$zipName" | Out-File -FilePath build.env -Encoding utf8 -Append'
    - 'New-Item -ItemType Directory -Path release_staging'
    - 'Copy-Item dist\qimpexp.exe                release_staging\'
    - 'Copy-Item README.FIRST.txt                release_staging\'
    - 'Copy-Item acb_worksheet_template.xlsx      release_staging\'
    - 'Copy-Item account_periods_template.json    release_staging\'
    - 'Copy-Item security_map_template.json       release_staging\'
    - 'Compress-Archive -Path release_staging\* -DestinationPath $zipName'
  artifacts:
    paths:
      - dist/qimpexp.exe
      - "qimpexp_*.zip"
      - setup.bat
    reports:
      dotenv: build.env
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-exe
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    name: "$CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: |
      ## QImpExp $CI_COMMIT_TAG

      ACB Excel workbook ↔ Quicken QIF converter for Canadian investment accounts.

      ### Download
      - **qimpexp_$CI_COMMIT_TAG.zip** — Windows standalone bundle (no Python required)
      - **setup.bat** — Python users: download this + the source ZIP, run setup.bat

      Getting started (no Python): unzip anywhere, read README.FIRST.txt, run qimpexp.exe.
      Getting started (Python): download source ZIP + setup.bat, extract, double-click setup.bat.

      SmartScreen warning: click More info then Run anyway.

      ### Verify exe integrity
      ```
      certutil -hashfile qimpexp.exe SHA256
      ```
      Expected: $SHA256

      ### What's new
      See CHANGELOG.md in the repository.
    assets:
      links:
        - name: "qimpexp_$CI_COMMIT_TAG.zip"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/qimpexp_$CI_COMMIT_TAG.zip?job=build-exe"
          link_type: package
        - name: "setup.bat"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/setup.bat?job=build-exe"
          link_type: other
